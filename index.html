<!DOCTYPE html>
<html>
<head>
  <title>CSAT Feedback</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 40px;
    }

    .box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: blue;
      color: white;
      border: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Customer Feedback</h2>

    <form id="feedbackForm">
      <input
        type="email"
        id="email"
        placeholder="Enter email"
        required
      >

      <select id="rating" required>
        <option value="">Select Rating</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <textarea
        id="comment"
        placeholder="Comment"
      ></textarea>

      <button type="submit">
        Submit Feedback
      </button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    document
      .getElementById("feedbackForm")
      .addEventListener("submit", async function (e) {

        e.preventDefault();

        const email =
          document.getElementById("email").value;

        const rating =
          document.getElementById("rating").value;

        const comment =
          document.getElementById("comment").value;

        try {

          const response = await fetch(
            "http://localhost:3000/submit",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                email,
                rating,
                comment
              })
            }
          );

          const data = await response.json();

          if (data.success) {

            document.getElementById("message")
              .innerText =
              "Feedback submitted successfully";

          } else {

            document.getElementById("message")
              .innerText =
              "Failed to submit";

          }

        } catch (error) {

          document.getElementById("message")
            .innerText =
            "Server Error";

        }
      });
  </script>
</body>
</html>
