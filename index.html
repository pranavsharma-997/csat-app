<!DOCTYPE html>
<html>
<head>
  <title>Thank You - TruckX</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
      color:white;
    }

    .card{
      width:100%;
      max-width:650px;
      background:#1e293b;
      border-radius:24px;
      padding:60px 40px;
      text-align:center;
      box-shadow:0 25px 70px rgba(0,0,0,0.45);
      border:1px solid rgba(255,255,255,0.08);
    }

    .icon{
      width:100px;
      height:100px;
      margin:0 auto 28px;
      border-radius:50%;
      background:#16a34a;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:50px;
      box-shadow:0 15px 35px rgba(22,163,74,0.45);
    }

    h1{
      margin:0 0 18px;
      font-size:48px;
      color:white;
    }

    p{
      margin:0;
      color:#cbd5e1;
      font-size:20px;
      line-height:1.7;
    }

    .footer{
      margin-top:35px;
      color:#94a3b8;
      font-size:14px;
    }

    @media(max-width:600px){

      .card{
        padding:45px 24px;
      }

      h1{
        font-size:36px;
      }

      p{
        font-size:17px;
      }

      .icon{
        width:85px;
        height:85px;
        font-size:42px;
      }
    }

  </style>
</head>

<body>

  <div class="card">

    <div class="icon">
      ✓
    </div>

    <h1>Thank You!</h1>

    <p>
      Your feedback has been submitted successfully.
      <br>
      We truly appreciate your time and support.
    </p>

    <div class="footer">
      Powered by TruckX
    </div>

  </div>

</body>
</html>
