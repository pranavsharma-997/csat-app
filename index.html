<!DOCTYPE html>
<html>
<head>
  <title>CSAT Feedback</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding-top: 100px;
    }

    button {
      margin: 5px;
      padding: 15px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #22c55e;
      color: white;
    }

    #submitBtn {
      display: none;
      margin-top: 20px;
      background: green;
      color: white;
    }

    #msg {
      display: none;
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<h2>How likely are you to recommend us?</h2>

<div id="ratings"></div>

<button id="submitBtn" onclick="submitScore()">Submit</button>

<div id="msg">🙏 Thank you for your feedback!</div>

<script>

let selectedScore = null;

// ✅ Email from URL or default
const params = new URLSearchParams(window.location.search);
let email = params.get("email") || "Pranav.sharma@truckx.com";

// 🎯 Buttons
for (let i = 0; i <= 10; i++) {
  const btn = document.createElement("button");
  btn.innerText = i;

  btn.onclick = () => {
    selectedScore = i;
    document.getElementById("submitBtn").style.display = "inline-block";
  };

  document.getElementById("ratings").appendChild(btn);
}

// 🚀 Submit
function submitScore() {

  if (selectedScore === null) {
    alert("Please select a score");
    return;
  }

  fetch("https://csat-app-x6xr.onrender.com/submit-score", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      score: selectedScore,
      email: email
    })
  })
  .then(res => {
    if (!res.ok) throw new Error("Failed");
    return res.json();
  })
  .then(() => {
    document.getElementById("submitBtn").style.display = "none";
    document.getElementById("msg").style.display = "block";
  })
  .catch(() => {
    alert("Error submitting feedback");
  });
}

</script>

</body>
</html>
