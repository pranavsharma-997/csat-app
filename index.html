<!DOCTYPE html>
<html>
<head>
  <title>TruckX Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #1e293b;
      border-radius: 18px;
      padding: 50px 44px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo-box {
      display: inline-flex;
      background: #020617;
      padding: 14px 24px;
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 14px 32px rgba(0,0,0,0.35);
    }

    .logo-box img {
      width: 190px;
      display: block;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 34px;
      color: white;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 auto 26px;
      max-width: 520px;
    }

    .agent-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 30px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
      text-align: left;
      color: #f8fafc;
    }

    .ratings {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 14px;
    }

    .rating-btn {
      width: 58px;
      height: 58px;
      border: none;
      background: #f1f5f9;
      color: #020617;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .rating-btn:hover {
      transform: translateY(-3px);
      background: #dbeafe;
    }

    .rating-btn.selected {
      background: #008000;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,128,0,0.4);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 13px;
      margin: 8px 0 28px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }

    textarea::placeholder { color: #94a3b8; }

    textarea:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.18);
    }

    .submit {
      margin-top: 28px;
      width: 180px;
      height: 58px;
      border: none;
      border-radius: 10px;
      background: #008000;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    #message {
      margin-top: 22px;
      font-size: 18px;
      font-weight: bold;
    }

    .footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card { padding: 34px 20px; }
      h1 { font-size: 26px; }
      .rating-btn { width: 52px; height: 52px; }
      .submit { width: 100%; }
      .logo-box img { width: 155px; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-box">
      <img src="./truckx-logo.png" alt="TruckX Logo">
    </div>

    <h1>How likely are you to recommend us?</h1>

    <p class="subtitle">
      Please rate the support you received. Your feedback helps TruckX improve service quality.
    </p>

    <div class="agent-box" id="agentText"></div>

    <div class="section-title">Rate your experience</div>
    <div class="ratings" id="ratings"></div>

    <div class="scale-labels">
      <span>1 = Poor</span>
      <span>10 = Excellent</span>
    </div>

    <div class="section-title">
      Comments <span style="font-weight:400; color:#94a3b8;">(optional)</span>
    </div>

    <textarea id="comment" placeholder="Tell us more about your experience..."></textarea>

    <br>

    <button class="submit" onclick="submitFeedback()">Submit</button>

    <p id="message"></p>

    <div class="footer">Powered by TruckX</div>
  </div>

  <script>
    const API_URL = "https://csat-app-mgd7.onrender.com";
    let selectedRating = null;

    const agents = {
      "aakash.mittal@truckx.com": "Aakash Mittaliya",
      "abhisheak.sharma@truckx.com": "Abhisheak Sharma",
      "abhishek.Jeste@truckx.com": "Abhishek Jeste",
      "abhishek.sambyal@truckx.com": "Abhishek Sambyal",
      "airish.chawla@truckx.com": "Airish Chawla",
      "akash.saini@truckx.com": "Akash Saini",
      "aman.deep@truckx.com": "Amandeep Mahto",
      "amisha.rajput@truckx.com": "Amisha",
      "amit.kumar@truckx.com": "Amit Kumar",
      "anil.kumar@truckx.com": "Anil Kumar",
      "anirudh.sharma@truckx.com": "Anirudh Sharma",
      "atin.goutam@truckx.com": "Atin Goutam",
      "bhanu.singh@truckx.com": "Bhanu Singh",
      "harish.kumar@truckx.com": "Harish Kumar",
      "hitesh.duggal@truckx.com": "Hitesh Duggal",
      "jaspreet.singh@truckx.com": "Jaspreet Singh",
      "jaswinder.kumar@truckx.com": "Jaswinder Kumar",
      "khushhal.garg@truckx.com": "Khushhal Garg",
      "nandini.kamra@truckx.com": "Nandini Kamra",
      "nivodhit.malik@truckx.com": "Nivodhit Malik",
      "om.sirohi@truckx.com": "Om Sirohi",
      "parag.jindal@truckx.com": "Parag Jindal",
      "pargat.singh@truckx.com": "Pargat Singh",
      "parminder.kaur@truckx.com": "Parminder Kaur",
      "parteek.kumar@truckx.com": "Parteek Kumar",
      "priyanka.chaudhary@truckx.com": "Priyanka Chaudhary",
      "priyanshu.gupta@truckx.com": "Priyanshu Gupta",
      "priyanshu.kumar@truckx.com": "Priyanshu Kumar",
      "rahul.kumar@truckx.com": "Rahul Kumar",
      "ravindra.khilwani@truckx.com": "Ravindra Khilwani",
      "reshab.sharma@truckx.com": "Reshab Sharma",
      "saiyam.parmar@truckx.com": "Saiyam Parmar",
      "sakshi.kansal@truckx.com": "Sakshi Kansal",
      "shailendra.dhyani@truckx.com": "Shailendra Dhyani",
      "shriya.jaswal@truckx.com": "Shriya Jaswal",
      "simran.kawatra@truckx.com": "Simran Kawatra",
      "somil.watts@truckx.com": "Somil Watts",
      "supriya.chauhan@truckx.com": "Supriya Chauhan",
      "tajwinder.singh@truckx.com": "Tajwinder Singh",
      "tania.sharma@truckx.com": "Tania Sharma",
      "ujjwal.kedia@truckx.com": "Ujjwal Kedia",
      "vaishnav.gupta@truckx.com": "Vaishnav Gupta",
      "vikas.gulia@truckx.com": "Vikas Gulia",
      "vishal.garg@truckx.com": "Vishal Garg",
      "yashika.gupta@truckx.com": "Yashika Gupta",
      "yukti.bansal@truckx.com": "Yukti Bansal",
      "yuvraj.singh@truckx.com": "Yuvraj Singh",
      "pranav.sharma@truckx.com": "Pranav Sharma",
      "parv.kapoor@truckx.com": "Parv Kapoor",
      "khushi.wadhwa@truckx.com": "Khushi Wadhwa",
      "sonali.gautam@truckx.com": "Sonali Gautam",
      "sahil.akhtar@truckx.com": "Sahil Akhtar",
      "vikram.aditya@truckx.com": "Vikram Aditya",
      "sargunpreet.kaur@truckx.com": "Sargunpreet Kaur",
      "bhrat.soni@truckx.com": "Bhrat Soni",
      "dipanshu.kansal@truckx.com": "Dipanshu Kansal"
    };

    const params = new URLSearchParams(window.location.search);
const agentEmail = params.get("agent");
const cxId = params.get("cxId");
const agentName = agents[agentEmail];

const isValidMobile = /^\d{10,16}$/.test(cxId || "");

if (!agentEmail || !agentName || !isValidMobile) {
  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#020617;
      color:white;
      font-family:Arial,sans-serif;
      text-align:center;
    ">
      <div>
        <h2>Invalid Feedback Link</h2>
        <p>Please use the official TruckX feedback link.</p>
      </div>
    </div>
  `;
  throw new Error("Invalid Link");
}

document.getElementById("agentText").innerText =
  "Support Agent: " + agentName;

    const ratingsDiv = document.getElementById("ratings");

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      btn.className = "rating-btn";

      btn.onclick = function () {
        selectedRating = i;

        document.querySelectorAll(".rating-btn").forEach(button => {
          button.classList.remove("selected");
        });

        btn.classList.add("selected");
      };

      ratingsDiv.appendChild(btn);
    }

    function getISTTime() {
      return new Date().toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    async function getCountry() {
      try {
        const response = await fetch("https://ipapi.co/json/");
        const data = await response.json();
        return data.country_name || "Unknown";
      } catch (error) {
        return "Unknown";
      }
    }

    async function submitFeedback() {
      const message = document.getElementById("message");
      const comment = document.getElementById("comment").value;

      if (!selectedRating) {
        message.style.color = "#ef4444";
        message.innerText = "❌ Please select a rating.";
        return;
      }

      message.style.color = "#cbd5e1";
      message.innerText = "Submitting...";

      try {
        const country = await getCountry();
        const submittedAtIST = getISTTime();

        const response = await fetch(`${API_URL}/submit`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            agentName: agentName,
            agentEmail: agentEmail,
            cxId: cxId,
            rating: selectedRating,
            comment: comment,
            country: country,
            submittedAtIST: submittedAtIST
          })
        });

        const data = await response.json();

        if (data.success) {
          document.body.innerHTML = `
            <div style="
              min-height:100vh;
              display:flex;
              justify-content:center;
              align-items:center;
              background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
              font-family:Arial,sans-serif;
              padding:20px;
            ">

              <div style="
                background:#1e293b;
                padding:55px 40px;
                border-radius:24px;
                text-align:center;
                max-width:650px;
                width:100%;
                box-shadow:0 25px 70px rgba(0,0,0,0.45);
                border:1px solid rgba(255,255,255,0.08);
              ">

                <div style="
                  width:95px;
                  height:95px;
                  background:#16a34a;
                  border-radius:50%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  margin:0 auto 30px;
                  font-size:48px;
                  color:white;
                  box-shadow:0 10px 30px rgba(22,163,74,0.4);
                ">
                  ✓
                </div>

                <h1 style="
                  color:white;
                  margin-bottom:18px;
                  font-size:38px;
                ">
                  Thank You!
                </h1>

                <p style="
                  color:#cbd5e1;
                  font-size:19px;
                  line-height:1.8;
                  margin-bottom:35px;
                ">
                  Your feedback has been submitted successfully.
                  <br>
                  We truly appreciate your time and valuable feedback.
                </p>

          

                <div style="
                  color:#64748b;
                  font-size:14px;
                ">
                  Powered by TruckX
                </div>

              </div>

            </div>
          `;
        } else {
          message.style.color = "#ef4444";
          message.innerText = "❌ " + (data.message || "Failed to submit feedback.");
        }

      } catch (error) {
        console.log(error);
        message.style.color = "#ef4444";
        message.innerText = "❌ Server error.";
      }
    }
  </script>
</body>
</html>
