<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TruckX Feedback</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000814;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 700px;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 34px;
    }

    .scores {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
    }

    .score-btn {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 10px;
      background: #d9d9d9;
      color: black;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .score-btn:hover {
      transform: scale(1.08);
    }

    .score-btn.active {
      background: green;
      color: white;
    }

    #submitBtn {
      background: green;
      color: white;
      border: none;
      padding: 16px 45px;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
    }

    #submitBtn:hover {
      opacity: 0.9;
    }

    .success {
      margin-top: 20px;
      color: lightgreen;
      font-size: 20px;
    }

    .error {
      margin-top: 20px;
      color: red;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>How likely are you to recommend us?</h1>

    <div class="scores" id="scores"></div>

    <button id="submitBtn">Submit</button>

    <div id="message"></div>

  </div>

  <script>

    // ============================
    // YOUR RENDER BACKEND URL
    // ============================

    const API_URL = "https://csat-app-x6xr.onrender.com";

    // ============================
    // GET EMAIL FROM URL
    // ============================

    const params = new URLSearchParams(window.location.search);

    const email = params.get("email");

    if (!email) {
      alert("Invalid link. Email missing.");
    }

    // ============================
    // SCORE BUTTONS
    // ============================

    const scoresDiv = document.getElementById("scores");

    let selectedScore = null;

    for (let i = 0; i <= 10; i++) {

      const btn = document.createElement("button");

      btn.innerText = i;

      btn.classList.add("score-btn");

      btn.onclick = () => {

        document.querySelectorAll(".score-btn").forEach(b => {
          b.classList.remove("active");
        });

        btn.classList.add("active");

        selectedScore = i;
      };

      scoresDiv.appendChild(btn);
    }

    // ============================
    // SUBMIT FEEDBACK
    // ============================

    const submitBtn = document.getElementById("submitBtn");

    submitBtn.onclick = async () => {

      const message = document.getElementById("message");

      message.innerHTML = "";

      if (selectedScore === null) {
        alert("Please select a score");
        return;
      }

      submitBtn.innerText = "Submitting...";

      try {

        const response = await fetch(`${API_URL}/submit-score`, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            score: selectedScore
          })
        });

        const data = await response.json();

        if (data.success) {

          message.innerHTML =
            `<div class="success">✅ Thank you for your feedback!</div>`;

        } else {

          message.innerHTML =
            `<div class="error">❌ Failed to submit feedback</div>`;
        }

      } catch (error) {

        console.log(error);

        message.innerHTML =
          `<div class="error">❌ Server error</div>`;
      }

      submitBtn.innerText = "Submit";
    };

  </script>

</body>

</html>
