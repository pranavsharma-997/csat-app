<!DOCTYPE html>
<html>
<head>
  <title>TruckX Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #07111f, #0f2b46, #123b5f);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 26px;
      padding: 34px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo-wrap {
      background: #07111f;
      border-radius: 18px;
      padding: 14px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 12px 30px rgba(7, 17, 31, 0.35);
    }

    .logo-wrap img {
      width: 190px;
      max-width: 100%;
      display: block;
    }

    h1 {
      margin: 8px 0;
      font-size: 30px;
      color: #0f172a;
    }

    .subtitle {
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .agent-box {
      background: linear-gradient(135deg, #eff6ff, #ecfeff);
      border: 1px solid #bae6fd;
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 24px;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .section-title {
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 12px;
    }

    .ratings {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .rating-btn {
      height: 45px;
      border: 2px solid #c7e7ff;
      background: #f8fbff;
      color: #0f74bd;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
    }

    .rating-btn:hover {
      background: #e0f2fe;
      transform: translateY(-2px);
    }

    .rating-btn.selected {
      background: linear-gradient(135deg, #0ea5e9, #075985);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 22px rgba(14, 165, 233, 0.35);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 12px;
      margin-bottom: 22px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      resize: vertical;
      font-family: Arial, sans-serif;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
    }

    textarea:focus {
      border-color: #0ea5e9;
      background: white;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    .submit {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: linear-gradient(135deg, #0ea5e9, #075985);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(14, 165, 233, 0.28);
    }

    .submit:hover {
      transform: translateY(-2px);
    }

    #message {
      margin-top: 16px;
      font-weight: 700;
    }

    .footer {
      margin-top: 22px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 560px) {
      .card {
        padding: 26px 20px;
      }

      h1 {
        font-size: 25px;
      }

      .ratings {
        grid-template-columns: repeat(5, 1fr);
      }

      .logo-wrap img {
        width: 155px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="./truckx-logo.png" alt="TruckX Logo">
    </div>

    <h1>How was your experience?</h1>
    <p class="subtitle">
      Please rate the support you received. Your feedback helps us improve our service quality.
    </p>

    <div class="agent-box" id="agentText"></div>

    <div class="section-title">Rate your experience</div>
    <div class="ratings" id="ratings"></div>

    <div class="scale-labels">
      <span>1 = Poor</span>
      <span>10 = Excellent</span>
    </div>

    <div class="section-title">
      Comments <span style="font-weight:400; color:#64748b;">(optional)</span>
    </div>

    <textarea id="comment" placeholder="Tell us more about your experience..."></textarea>

    <button class="submit" onclick="submitFeedback()">Submit Feedback</button>

    <p id="message"></p>

    <div class="footer">Powered by TruckX</div>
  </div>

  <script>
    const API_URL = "https://csat-app-mgd7.onrender.com";
    let selectedRating = null;

    const agents = {
      "aakash.mittal@truckx.com": "Aakash Mittaliya",
      "abhisheak.sharma@truckx.com": "Abhisheak Sharma",
      "abhishek.Jeste@truckx.com": "Abhishek Jeste",
      "abhishek.sambyal@truckx.com": "Abhishek Sambyal",
      "airish.chawla@truckx.com": "Airish Chawla",
      "akash.saini@truckx.com": "Akash Saini",
      "aman.deep@truckx.com": "Amandeep Mahto",
      "amisha.rajput@truckx.com": "Amisha",
      "amit.kumar@truckx.com": "Amit Kumar",
      "anil.kumar@truckx.com": "Anil Kumar",
      "anirudh.sharma@truckx.com": "Anirudh Sharma",
      "atin.goutam@truckx.com": "Atin Goutam",
      "bhanu.singh@truckx.com": "Bhanu Singh",
      "harish.kumar@truckx.com": "Harish Kumar",
      "hitesh.duggal@truckx.com": "Hitesh Duggal",
      "jaspreet.singh@truckx.com": "Jaspreet Singh",
      "jaswinder.kumar@truckx.com": "Jaswinder Kumar",
      "khushhal.garg@truckx.com": "Khushhal Garg",
      "nandini.kamra@truckx.com": "Nandini Kamra",
      "nivodhit.malik@truckx.com": "Nivodhit Malik",
      "om.sirohi@truckx.com": "Om Sirohi",
      "parag.jindal@truckx.com": "Parag Jindal",
      "pargat.singh@truckx.com": "Pargat Singh",
      "parminder.kaur@truckx.com": "Parminder Kaur",
      "parteek.kumar@truckx.com": "Parteek Kumar",
      "priyanka.chaudhary@truckx.com": "Priyanka Chaudhary",
      "priyanshu.gupta@truckx.com": "Priyanshu Gupta",
      "priyanshu.kumar@truckx.com": "Priyanshu Kumar",
      "rahul.kumar@truckx.com": "Rahul Kumar",
      "ravindra.khilwani@truckx.com": "Ravindra Khilwani",
      "reshab.sharma@truckx.com": "Reshab Sharma",
      "saiyam.parmar@truckx.com": "Saiyam Parmar",
      "sakshi.kansal@truckx.com": "Sakshi Kansal",
      "shailendra.dhyani@truckx.com": "Shailendra Dhyani",
      "shriya.jaswal@truckx.com": "Shriya Jaswal",
      "simran.kawatra@truckx.com": "Simran Kawatra",
      "somil.watts@truckx.com": "Somil Watts",
      "supriya.chauhan@truckx.com": "Supriya Chauhan",
      "tajwinder.singh@truckx.com": "Tajwinder Singh",
      "tania.sharma@truckx.com": "Tania Sharma",
      "ujjwal.kedia@truckx.com": "Ujjwal Kedia",
      "vaishnav.gupta@truckx.com": "Vaishnav Gupta",
      "vikas.gulia@truckx.com": "Vikas Gulia",
      "vishal.garg@truckx.com": "Vishal Garg",
      "yashika.gupta@truckx.com": "Yashika Gupta",
      "yukti.bansal@truckx.com": "Yukti Bansal",
      "yuvraj.singh@truckx.com": "Yuvraj Singh",
      "pranav.sharma@truckx.com": "Pranav Sharma"
    };

    const params = new URLSearchParams(window.location.search);
    const agentEmail = params.get("agent");
    const agentName = agents[agentEmail];

    if (!agentEmail || !agentName) {
      document.body.innerHTML = `
        <div style="font-family: Arial; text-align:center; padding:50px; color:white;">
          <h2>Invalid feedback link</h2>
          <p>Agent email is missing or not found.</p>
        </div>
      `;
    } else {
      document.getElementById("agentText").innerText = "Support Agent: " + agentName;
    }

    const ratingsDiv = document.getElementById("ratings");

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      btn.className = "rating-btn";

      btn.onclick = function () {
        selectedRating = i;

        document.querySelectorAll(".rating-btn").forEach(button => {
          button.classList.remove("selected");
        });

        btn.classList.add("selected");
      };

      ratingsDiv.appendChild(btn);
    }

    async function submitFeedback() {
      const message = document.getElementById("message");
      const comment = document.getElementById("comment").value;

      if (!selectedRating) {
        message.style.color = "#dc2626";
        message.innerText = "Please select a rating before submitting.";
        return;
      }

      message.style.color = "#334155";
      message.innerText = "Submitting your feedback...";

      try {
        const response = await fetch(`${API_URL}/submit`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            agentName: agentName,
            agentEmail: agentEmail,
            rating: selectedRating,
            comment: comment
          })
        });

        const data = await response.json();

        if (data.success) {
          message.style.color = "#16a34a";
          message.innerText = "Thank you! Your feedback has been submitted.";
        } else {
          message.style.color = "#dc2626";
          message.innerText = data.message || "Failed to submit feedback.";
        }
      } catch (error) {
        message.style.color = "#dc2626";
        message.innerText = "Server error. Please try again.";
      }
    }
  </script>
</body>
</html>
