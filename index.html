<!DOCTYPE html>
<html>
<head>
  <title>CSAT Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #dbeafe);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(37, 99, 235, 0.18);
      text-align: center;
      width: 520px;
      max-width: 92%;
    }

    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    h2 {
      margin: 8px 0;
      color: #111827;
      font-size: 26px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .agent {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      color: #374151;
      margin-bottom: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    .ratings {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin: 20px 0;
    }

    .rating-btn {
      padding: 12px 0;
      border: 2px solid #dbeafe;
      background: #f8fafc;
      color: #2563eb;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: 0.2s;
    }

    .rating-btn:hover {
      background: #dbeafe;
      transform: translateY(-2px);
    }

    .rating-btn.selected {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.35);
    }

    .scale-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 22px;
    }

    textarea {
      width: 100%;
      min-height: 95px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      resize: vertical;
      font-family: Arial, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .submit {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
    }

    #message {
      margin-top: 16px;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .ratings {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="badge">Customer Satisfaction Survey</div>

    <h2>Rate your experience</h2>
    <p class="subtitle">How satisfied are you with the support you received?</p>

    <div class="agent" id="agentText"></div>

    <div class="ratings" id="ratings"></div>

    <div class="scale-labels">
      <span>1 = Poor</span>
      <span>10 = Excellent</span>
    </div>

    <textarea id="comment" placeholder="Additional comments (optional)"></textarea>

    <button class="submit" onclick="submitFeedback()">Submit Feedback</button>

    <p id="message"></p>
  </div>

  <script>
    const API_URL = "https://csat-app-mgd7.onrender.com";
    let selectedRating = null;

    const agents = {
      "aakash.mittal@truckx.com": "Aakash Mittaliya",
      "abhisheak.sharma@truckx.com": "Abhisheak Sharma",
      "abhishek.Jeste@truckx.com": "Abhishek Jeste",
      "abhishek.sambyal@truckx.com": "Abhishek Sambyal",
      "airish.chawla@truckx.com": "Airish Chawla",
      "akash.saini@truckx.com": "Akash Saini",
      "aman.deep@truckx.com": "Amandeep Mahto",
      "amisha.rajput@truckx.com": "Amisha",
      "amit.kumar@truckx.com": "Amit Kumar",
      "anil.kumar@truckx.com": "Anil Kumar",
      "anirudh.sharma@truckx.com": "Anirudh Sharma",
      "atin.goutam@truckx.com": "Atin Goutam",
      "bhanu.singh@truckx.com": "Bhanu Singh",
      "harish.kumar@truckx.com": "Harish Kumar",
      "hitesh.duggal@truckx.com": "Hitesh Duggal",
      "jaspreet.singh@truckx.com": "Jaspreet Singh",
      "jaswinder.kumar@truckx.com": "Jaswinder Kumar",
      "khushhal.garg@truckx.com": "Khushhal Garg",
      "nandini.kamra@truckx.com": "Nandini Kamra",
      "nivodhit.malik@truckx.com": "Nivodhit Malik",
      "om.sirohi@truckx.com": "Om Sirohi",
      "parag.jindal@truckx.com": "Parag Jindal",
      "pargat.singh@truckx.com": "Pargat Singh",
      "parminder.kaur@truckx.com": "Parminder Kaur",
      "parteek.kumar@truckx.com": "Parteek Kumar",
      "priyanka.chaudhary@truckx.com": "Priyanka Chaudhary",
      "priyanshu.gupta@truckx.com": "Priyanshu Gupta",
      "priyanshu.kumar@truckx.com": "Priyanshu Kumar",
      "rahul.kumar@truckx.com": "Rahul Kumar",
      "ravindra.khilwani@truckx.com": "Ravindra Khilwani",
      "reshab.sharma@truckx.com": "Reshab Sharma",
      "saiyam.parmar@truckx.com": "Saiyam Parmar",
      "sakshi.kansal@truckx.com": "Sakshi Kansal",
      "shailendra.dhyani@truckx.com": "Shailendra Dhyani",
      "shriya.jaswal@truckx.com": "Shriya Jaswal",
      "simran.kawatra@truckx.com": "Simran Kawatra",
      "somil.watts@truckx.com": "Somil Watts",
      "supriya.chauhan@truckx.com": "Supriya Chauhan",
      "tajwinder.singh@truckx.com": "Tajwinder Singh",
      "tania.sharma@truckx.com": "Tania Sharma",
      "ujjwal.kedia@truckx.com": "Ujjwal Kedia",
      "vaishnav.gupta@truckx.com": "Vaishnav Gupta",
      "vikas.gulia@truckx.com": "Vikas Gulia",
      "vishal.garg@truckx.com": "Vishal Garg",
      "yashika.gupta@truckx.com": "Yashika Gupta",
      "yukti.bansal@truckx.com": "Yukti Bansal",
      "yuvraj.singh@truckx.com": "Yuvraj Singh",
      "pranav.sharma@truckx.com": "Pranav Sharma"
    };

    const params = new URLSearchParams(window.location.search);
    const agentEmail = params.get("agent");
    const agentName = agents[agentEmail];

    if (!agentEmail || !agentName) {
      document.body.innerHTML = `
        <div style="font-family: Arial; text-align:center; padding:50px;">
          <h2>Invalid feedback link</h2>
          <p>Agent email is missing or not found.</p>
        </div>
      `;
    } else {
      document.getElementById("agentText").innerText = "Support Agent: " + agentName;
    }

    const ratingsDiv = document.getElementById("ratings");

    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement("button");
      btn.innerText = i;
      btn.className = "rating-btn";

      btn.onclick = function () {
        selectedRating = i;

        document.querySelectorAll(".rating-btn").forEach(button => {
          button.classList.remove("selected");
        });

        btn.classList.add("selected");
      };

      ratingsDiv.appendChild(btn);
    }

    async function submitFeedback() {
      const message = document.getElementById("message");
      const comment = document.getElementById("comment").value;

      if (!selectedRating) {
        message.style.color = "red";
        message.innerText = "Please select a rating.";
        return;
      }

      message.style.color = "#374151";
      message.innerText = "Submitting...";

      try {
        const response = await fetch(`${API_URL}/submit`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            agentName: agentName,
            agentEmail: agentEmail,
            rating: selectedRating,
            comment: comment
          })
        });

        const data = await response.json();

        if (data.success) {
          message.style.color = "green";
          message.innerText = "Thank you! Your feedback has been submitted.";
        } else {
          message.style.color = "red";
          message.innerText = data.message || "Failed to submit feedback.";
        }
      } catch (error) {
        message.style.color = "red";
        message.innerText = "Server error. Please try again.";
      }
    }
  </script>
</body>
</html>
