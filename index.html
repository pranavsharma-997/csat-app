<!DOCTYPE html>
<html>
<head>
  <title>CSAT Feedback</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding-top: 100px;
    }

    #ratings button {
      margin: 5px;
      padding: 15px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    #ratings button:hover {
      background: green;
      color: white;
    }

    #submitBtn {
      display: none;
      margin-top: 20px;
      padding: 12px 20px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }

    #msg {
      display: none;
      margin-top: 20px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<h2>How likely are you to recommend us?</h2>

<div id="ratings"></div>

<button id="submitBtn">Submit</button>

<div id="msg">🙏 Thank you for your feedback!</div>

<script>

// 🔹 Get email
const params = new URLSearchParams(window.location.search);
const email = params.get("email");

// ❗ Do NOT stop script with alert (this was breaking clicks)
if (!email) {
  console.log("Email missing");
}

let selectedScore = null;

// 🔥 Create buttons properly
const ratingsDiv = document.getElementById("ratings");

for (let i = 0; i <= 10; i++) {
  const btn = document.createElement("button");
  btn.innerText = i;

  btn.addEventListener("click", function () {

    selectedScore = i;

    // highlight
    document.querySelectorAll("#ratings button").forEach(b => {
      b.style.background = "";
      b.style.color = "";
    });

    btn.style.background = "green";
    btn.style.color = "white";

    document.getElementById("submitBtn").style.display = "inline-block";
  });

  ratingsDiv.appendChild(btn);
}

// 🔥 Submit logic
document.getElementById("submitBtn").addEventListener("click", async function () {

  if (selectedScore === null) {
    alert("Please select a score");
    return;
  }

  const btn = this;
  btn.innerText = "Submitting...";
  btn.disabled = true;

  try {
    const res = await fetch("https://csat-app-x6xr.onrender.com/submit-score", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        score: selectedScore,
        email: email
      })
    });

    if (!res.ok) throw new Error();

    btn.style.display = "none";
    document.getElementById("msg").style.display = "block";

  } catch (err) {

    alert("Server waking up. Try again in 10 sec");

    btn.innerText = "Submit";
    btn.disabled = false;
  }
});

</script>

</body>
</html>
